spring.application.name=file-upload

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

file.upload.directory=uploads
file.upload.max-size-bytes=2097152
file.upload.allowed-types=image/png,image/jpeg,application/pdf

spring.datasource.url=jdbc:mysql://localhost:3306/file_upload_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600