databaseChangeLog:
  - changeSet:
      id: 001-create-security-tables
      author: anna

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uk_users_username

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_SIMPLE_USER

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_BATCH_USER

  - changeSet:
      id: 002-seed-security-users
      author: anna
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: simple_user
              - column:
                  name: password
                  value: "$2a$10$HJoX.Y2mIxymTpwexze6gONYH.2/COdyvG.LCepMJGrhDX26DjT1q"
              - column:
                  name: enabled
                  valueBoolean: true

        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: batch_user
              - column:
                  name: password
                  value: "$2a$10$AstMgJdpkoDYme5FZfEmE.y1iHG1kGfZz7FYJaw3vxrXFnlxx6/KC"
              - column:
                  name: enabled
                  valueBoolean: true

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE username = 'simple_user')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_SIMPLE_USER')"

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE username = 'batch_user')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_BATCH_USER')"

  - changeSet:
      id: 003-create-activity-logs
      author: anna
      changes:
        - createTable:
            tableName: activity_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(100)

              - column:
                  name: action_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: success
                  type: TINYINT
                  constraints:
                    nullable: false

              - column:
                  name: http_method
                  type: VARCHAR(10)

              - column:
                  name: endpoint
                  type: VARCHAR(255)

              - column:
                  name: file_id
                  type: VARCHAR(36)

              - column:
                  name: details
                  type: VARCHAR(1000)

              - column:
                  name: created_at
                  type: DATETIME(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-file-metadata-table
      author: anna
      changes:
        - createTable:
            tableName: file_metadata
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false